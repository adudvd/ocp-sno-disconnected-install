# ImageSetConfiguration for oc-mirror plugin v2
# Mirrors exactly OpenShift 4.22.11 plus a small, curated operator set.
#
# Usage (see docs/INSTALL-GUIDE.md, section 5):
#   oc mirror -c imageset-config.yaml file:///data/oc-mirror --v2                       # mirror-to-disk (connected host)
#   oc mirror -c imageset-config.yaml --from file:///data/oc-mirror \
#       docker://registry.example.lab:8443 --v2                                         # disk-to-mirror (disconnected host)
#   oc mirror -c imageset-config.yaml --workspace file:///data/oc-mirror \
#       docker://registry.example.lab:8443 --v2                                         # mirror-to-mirror (partially connected)
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  platform:
    architectures:
      - amd64
    channels:
      - name: stable-4.22
        type: ocp
        minVersion: 4.22.11
        maxVersion: 4.22.11
    # Mirrors the OpenShift Update Service graph image so the cluster can be
    # updated later through a local OSUS instance. Set to false if not needed.
    graph: true

  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.22
      # Only the listed packages are mirrored. Remove/add packages as needed.
      # Mirroring the full catalog is several hundred GB.
      packages:
        - name: lvms-operator            # Local storage (LVM) for single-node OpenShift
          channels:
            - name: stable-4.22
        - name: local-storage-operator
        - name: kubernetes-nmstate-operator
        - name: cluster-logging
        - name: web-terminal

  additionalImages:
    # Handy debug / utility images for a disconnected cluster
    - name: registry.redhat.io/ubi9/ubi:latest
    - name: registry.redhat.io/rhel9/support-tools:latest

# Cluster image configuration: trust the registry CA (see 07) and
# optionally restrict pulls to the mirror registry only.
apiVersion: config.openshift.io/v1
kind: Image
metadata:
  name: cluster
spec:
  additionalTrustedCA:
    name: registry-ca

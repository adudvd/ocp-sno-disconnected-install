# Optional: LVM Storage (LVMS) for persistent volumes on SNO.
# Requires the lvms-operator from the mirrored catalog and a spare, empty disk.
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-storage
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-storage-og
  namespace: openshift-storage
spec:
  targetNamespaces:
    - openshift-storage
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: lvms-operator
  namespace: openshift-storage
spec:
  channel: stable-4.22
  name: lvms-operator
  source: cs-redhat-operator-index-v4-22
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
---
# Apply after the operator CSV reports Succeeded:
#   oc get csv -n openshift-storage
apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: lvmcluster
  namespace: openshift-storage
spec:
  storage:
    deviceClasses:
      - name: vg1
        default: true
        fstype: xfs
        deviceSelector:
          paths:
            - /dev/sdb               # <SPARE_DISK> must be empty, NOT the install disk
        thinPoolConfig:
          name: thin-pool-1
          sizePercent: 90
          overprovisionRatio: 10

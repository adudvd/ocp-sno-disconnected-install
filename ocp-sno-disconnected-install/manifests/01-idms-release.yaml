# ImageDigestMirrorSet for the OpenShift release payload.
# oc-mirror v2 generates this (and more) in:
#   <workspace>/working-dir/cluster-resources/idms-oc-mirror.yaml
# ALWAYS prefer the generated file; this is a reference example.
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  name: idms-release-0
spec:
  imageDigestMirrors:
    - mirrors:
        - registry.example.lab:8443/openshift/release
      source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
    - mirrors:
        - registry.example.lab:8443/openshift/release-images
      source: quay.io/openshift-release-dev/ocp-release

# ImageDigestMirrorSet for operator images (example).
# oc-mirror v2 writes the real list for the packages you mirrored to
#   <workspace>/working-dir/cluster-resources/idms-oc-mirror.yaml
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  name: idms-operator-0
spec:
  imageDigestMirrors:
    - mirrors:
        - registry.example.lab:8443/lvms4
      source: registry.redhat.io/lvms4
    - mirrors:
        - registry.example.lab:8443/openshift4
      source: registry.redhat.io/openshift4
    - mirrors:
        - registry.example.lab:8443/openshift-logging
      source: registry.redhat.io/openshift-logging
    - mirrors:
        - registry.example.lab:8443/web-terminal
      source: registry.redhat.io/web-terminal
    - mirrors:
        - registry.example.lab:8443/rhel9
      source: registry.redhat.io/rhel9

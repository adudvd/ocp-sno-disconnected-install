# ClusterCatalog (OLM v1) pointing at the mirrored operator index.
# oc-mirror v2 generates: cc-redhat-operator-index-v4-22.yaml
apiVersion: olm.operatorframework.io/v1
kind: ClusterCatalog
metadata:
  name: cc-redhat-operator-index-v4-22
spec:
  priority: 0
  source:
    type: Image
    image:
      ref: registry.example.lab:8443/redhat/redhat-operator-index:v4.22

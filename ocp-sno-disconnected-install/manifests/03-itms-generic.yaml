# ImageTagMirrorSet for images referenced by tag (example).
# Generated by oc-mirror v2 as itms-oc-mirror.yaml when tag-based images
# (for example additionalImages with :latest) are mirrored.
apiVersion: config.openshift.io/v1
kind: ImageTagMirrorSet
metadata:
  name: itms-generic-0
spec:
  imageTagMirrors:
    - mirrors:
        - registry.example.lab:8443/ubi9
      source: registry.redhat.io/ubi9
    - mirrors:
        - registry.example.lab:8443/rhel9
      source: registry.redhat.io/rhel9
